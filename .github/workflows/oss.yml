name: Refresh open-source table

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily — off-the-hour to dodge Actions queue spikes
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update-oss.mjs'
      - '.github/workflows/oss.yml'

permissions:
  contents: write

concurrency:
  group: refresh-oss
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate the table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-oss.mjs

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "README unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh open-source table"
          git push
