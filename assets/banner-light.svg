<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Nitin Tanwar, Full-Stack Engineer">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d0d7de"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="55%" stop-color="#1a7f37"/>
      <stop offset="100%" stop-color="#1a7f37" stop-opacity="0"/>
    </linearGradient>
    <style>
      .n { font: 700 58px "Segoe UI", Inter, system-ui, -apple-system, sans-serif; fill: #1f2328; letter-spacing: -1.5px; }
      .m { font: 400 17px ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; fill: #59636e; }
      .k { fill: #0969da; }
      .g { fill: #1a7f37; }
      .cur { fill: #1a7f37; animation: b 1.1s steps(1) infinite; }
      @keyframes b { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
      .draw { stroke-dasharray: 420; stroke-dashoffset: 0; animation: d 1.4s ease-out; }
      @keyframes d { from { stroke-dashoffset: 420 } to { stroke-dashoffset: 0 } }
    </style>
  </defs>

  <rect width="1000" height="220" fill="#ffffff"/>
  <rect width="1000" height="220" fill="url(#grid)" opacity="0.7"/>
  <rect width="1000" height="220" fill="url(#fade)"/>

  <text class="m" x="64" y="52"><tspan class="k">const</tspan> engineer = {</text>
  <text class="n" x="64" y="118">Nitin Tanwar</text>
  <line class="draw" x1="64" y1="140" x2="484" y2="140" stroke="url(#rule)" stroke-width="3" stroke-linecap="round"/>
  <text class="m" x="64" y="176">full-stack engineer <tspan class="g">@</tspan> novus aegis ai <tspan fill="#8c959f">·</tspan> mca <tspan class="g">@</tspan> cdac noida</text>
  <text class="m" x="64" y="206">};<tspan class="cur" dx="8">&#9608;</tspan></text>
</svg>
